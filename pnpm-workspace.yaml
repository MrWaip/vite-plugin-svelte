packages:
  - 'packages/*'
  - 'packages/e2e-tests/*'
  - 'packages/e2e-tests/_test_dependencies/*'

# package resolution settings
minimumReleaseAge: 4320 #3 days

minimumReleaseAgeExclude:
  - 'vite'
  - 'create-vite'
  - '@vitejs/*'
  - 'vitest'
  - '@vitest/*'
  - 'svelte'
  - '@sveltejs/*'
  - prettier-plugin-svelte
  - svelte-check
  - 'rolldown-vite'
  - 'rolldown'
  - '@rolldown/*'
  - '@oxc-project/*'
  - 'devalue'
  - 'esm-env'
  - 'esrap'
  - 'is-reference'
  - 'locate-character'
  - 'zimmerframe'
  - 'vitefu'
  - '@mrwaip/*'

onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - 'carbon-components-svelte'
  - 'es5-ext'
  - 'svelte-preprocess'

auditConfig:
  ignoreGhsas:
    - 'GHSA-67mh-4wv8-2f99'
    - 'GHSA-v6h2-p8h4-qcjw'
    # everything below reaches us only via `vitefu > vite > ...`, i.e. the dependency tree of the
    # optional peer Vite that the consumer supplies. we neither ship nor pin these packages, so
    # they cannot be fixed here - they are fixed by the consumer upgrading Vite.
    - 'GHSA-23c5-xmqv-rm74' # minimatch, via vite > stylus > glob
    - 'GHSA-3ppc-4f35-3m26' # minimatch, via vite > stylus > glob
    - 'GHSA-7r86-cg39-jmmj' # minimatch, via vite > stylus > glob
    - 'GHSA-3jxr-9vmj-r5cp' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-f886-m6hf-6m8v' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-mh99-v99m-4gvg' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-3v7f-55p6-f55p' # picomatch, via vite
    - 'GHSA-c2c7-rcm5-vvqj' # picomatch, via vite
    - 'GHSA-48c2-rrv3-qjmp' # yaml, via vite - we don't consume public yaml files
    - 'GHSA-6g55-p6wh-862q' # postcss, via vite
    - 'GHSA-qx2v-qp2m-jg93' # postcss, via vite
    - 'GHSA-r28c-9q8g-f849' # postcss, via vite
    - 'GHSA-mw96-cpmx-2vgc' # rollup, via vite
    - 'GHSA-v56q-mh7h-f735' # immutable, via vite > sass
    - 'GHSA-wf6x-7x77-mvgw' # immutable, via vite > sass
    - 'GHSA-xvcm-6775-5m9r' # immutable, via vite > sass

updateConfig:
  ignoreDependencies:
    - 'execa' # v9 is larger than v8 and doesn't work the same, we only use it in testing

overrides:
  # $ prefixed package names take their version from root package.json - this is like catalogs but without them
  '@sveltejs/kit': '$@sveltejs/kit'
  '@sveltejs/kit>@mrwaip/vite-plugin-svelte': 'workspace:^'
  '@mrwaip/vite-plugin-svelte': 'workspace:^'
  '@sveltejs/vite-plugin-svelte-inspector': 'workspace:^'
  'svelte': '$svelte'
  'vite': '$vite'
  '@types/node@<=20.12.0': '20.19.14'
  'send@<0.19.0': '^0.19.1'
  '@sveltejs/kit>cookie@<0.7.0': '^0.7.2'

#cli output
aggregateOutput: true
reporter: append-only

# needed for _test_dependencies
dedupeInjectedDeps: false
