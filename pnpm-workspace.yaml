packages:
  - 'packages/*'
  - 'packages/e2e-tests/*'
  - 'packages/e2e-tests/_test_dependencies/*'

# package resolution settings
minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@sveltejs/*'
  - svelte
  - esrap
  - devalue
  - zimmerframe
  - prettier-plugin-svelte
  - svelte-check
  - esm-env
  - 'rolldown-vite'
  - 'rolldown'
  - '@rolldown/*'
  - '@oxc-project/*'
  - 'is-reference'
  - 'locate-character'
  - 'vitefu'
  - '@mrwaip/*'

onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - 'carbon-components-svelte'
  - 'es5-ext'
  - 'svelte-preprocess'

auditConfig:
  ignoreGhsas:
    - 'GHSA-67mh-4wv8-2f99'
    - 'GHSA-v6h2-p8h4-qcjw'
    - 'GHSA-wf6x-7x77-mvgw' # we aren't using mergeDeep from immutable with public inputs
    - 'GHSA-48c2-rrv3-qjmp' # we don't consume public yaml files
    # everything below reaches us only via `vitefu > vite > ...`, i.e. the dependency tree of the
    # optional peer Vite that the consumer supplies. we neither ship nor pin these packages, so
    # they cannot be fixed here - they are fixed by the consumer upgrading Vite.
    - 'GHSA-f886-m6hf-6m8v' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-3jxr-9vmj-r5cp' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-mh99-v99m-4gvg' # brace-expansion, via vite > stylus > glob > minimatch
    - 'GHSA-r28c-9q8g-f849' # postcss, via vite > postcss
    - 'GHSA-v56q-mh7h-f735' # immutable, via vite > sass
    - 'GHSA-xvcm-6775-5m9r' # immutable, via vite > sass

overrides:
  # $ prefixed package names take their version from root package.json - this is like catalogs but without them
  '@sveltejs/kit': '$@sveltejs/kit'
  '@sveltejs/kit>@mrwaip/vite-plugin-svelte': 'workspace:^'
  '@mrwaip/vite-plugin-svelte': 'workspace:^'
  'svelte': '$svelte'
  'vite': '$vite'
  '@types/node@<=20.12.0': '20.19.43'
  '@sveltejs/kit>cookie@<0.7.0': '^0.7.2'

# pnpm catalogs are currently only suitable for dependencies that
# wouldn't require publishing a new package version
# see https://github.com/changesets/changesets/issues/1707
catalog:
  '@sveltejs/kit': ^2.59.1
  vite: ^8.0.9

# needed for _test_dependencies
dedupeInjectedDeps: false

# enables cross-platform scripting so we don't need cross-env
shellEmulator: true

# cli output
# These are only documented as inline options and they also show an error in VS Code
# based on the schema from https://json.schemastore.org/pnpm-workspace.json
# However, they do work and are valid options
aggregateOutput: true
reporter: append-only
